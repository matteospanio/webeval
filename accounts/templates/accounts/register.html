{% extends "studio/base.html" %}
{% block title %}Register · webeval{% endblock %}
{% block content %}
<article style="max-width:32rem;margin:2rem auto;">
  <hgroup><h1>Create your account</h1><p>Register to create and run studies.</p></hgroup>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <button type="submit">Register</button>
  </form>
  <p><small>Already have an account? <a href="{% url 'accounts:login' %}">Log in</a></small></p>
</article>
{% endblock %}

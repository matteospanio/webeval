{% extends "base.html" %}

{% block title %}{{ experiment.name }}{% endblock %}

{% block content %}
  <article class="we-card we-narrow">
    <h1>Access code required</h1>
    <p>This study is private. Enter the access code you were given to continue.</p>
    {% if error %}<div class="we-alert we-alert-error" role="alert">That code wasn't recognised.</div>{% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="we-field">
        <label for="access-code">Access code</label>
        <input type="text" id="access-code" name="access_code" autofocus required>
      </div>
      <button type="submit" class="we-btn we-btn-primary">Continue</button>
    </form>
  </article>
{% endblock %}

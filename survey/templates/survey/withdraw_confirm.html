{% extends "base.html" %}

{% block title %}{{ experiment.name }}{% endblock %}

{% block content %}
  <article class="we-card we-narrow">
    <h1>Withdraw from this study</h1>
    <p>This will permanently delete the responses you have given so far for
       <strong>{{ experiment.name }}</strong>. This cannot be undone.</p>
    <form method="post" class="we-actions">
      {% csrf_token %}
      <button type="submit" class="we-btn we-btn-danger">Withdraw and delete my data</button>
      <a href="{% url 'survey:consent' slug=experiment.slug %}" class="we-btn">Cancel</a>
    </form>
  </article>
{% endblock %}
